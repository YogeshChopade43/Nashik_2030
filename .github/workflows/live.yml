# Live feeds (ECMWF weather, GloFAS river, IMD warnings) → static JSON → Pages deploy.
# Free on public repos; users read static files, so usage is unlimited.
name: live

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      # Start from the last published feeds: a feed that fails this run keeps its previous file
      # (the app then marks it stale) instead of disappearing.
      - name: Restore previous live data
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: live.yml
          name: live
          path: public/live
          workflow_conclusion: success
          if_no_artifact_found: warn
      - name: Fetch feeds
        run: python -m pipeline.run
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
          IMD_API_KEY: ${{ secrets.IMD_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: live
          path: public/live
          retention-days: 14
          if-no-files-found: warn

  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    with:
      live_from_this_run: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
